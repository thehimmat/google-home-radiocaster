<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream atTheBunga - Cast Receiver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Gurmukhi:wght@400;600&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Crimson Pro', Georgia, serif;
      background: linear-gradient(135deg, #1a1614 0%, #2a2520 100%);
      color: #fef8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .logo {
      margin-bottom: 60px;
      opacity: 0.95;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }

    .logo img {
      height: 80px;
      width: auto;
    }

    .now-playing {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #d4cdc6;
      border-radius: 8px;
      padding: 40px;
      backdrop-filter: blur(10px);
      margin-bottom: 30px;
    }

    .artwork {
      margin-bottom: 30px;
    }

    .artwork img {
      width: 200px;
      height: 200px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid #d4cdc6;
      object-fit: cover;
    }

    .metadata {
      margin-top: 30px;
    }

    .artist {
      font-size: 18px;
      color: #d4cdc6;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .title {
      font-size: 32px;
      font-weight: 600;
      color: #fef8e8;
      line-height: 1.3;
      margin-bottom: 20px;
    }

    .station-info {
      font-size: 14px;
      color: #a8a09a;
      letter-spacing: 0.5px;
    }

    .loading {
      margin-top: 50px;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(212, 205, 198, 0.3);
      border-top: 3px solid #d4cdc6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-message {
      margin-top: 20px;
      font-size: 14px;
      color: #a8a09a;
      font-style: italic;
    }

    /* Lyrics (cast-lyrics.js): while a shabad is confirmed, the card moves left and the
       shabad fills the rest of the screen, with the sung line highlighted. */
    .lyrics {
      display: none;
    }

    /* The SDK's own touch player (smart displays). touchScreenOptimizedApp should
       stop it; this keeps it hidden if a device injects it anyway. */
    touch-controls {
      display: none !important;
    }

    body.has-lyrics {
      padding: 5vh 4vw;
    }

    body.has-lyrics .container {
      max-width: none;
      height: 90vh;
      display: grid;
      grid-template-columns: minmax(220px, 28%) 1fr;
      gap: 4vw;
      align-items: center;
    }

    body.has-lyrics .logo {
      display: none;
    }

    body.has-lyrics .now-playing {
      margin: 0;
      padding: 28px 20px;
    }

    body.has-lyrics .artwork {
      margin-bottom: 0;
    }

    body.has-lyrics .artwork img {
      width: 150px !important;
      height: 150px !important;
      object-fit: cover !important;
      padding: 0 !important;
    }

    body.has-lyrics .title {
      font-size: 26px;
      margin-bottom: 8px;
    }

    body.has-lyrics .loading {
      margin-top: 20px;
    }

    body.has-lyrics .lyrics {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      text-align: left;
    }

    .lyrics-source {
      font-size: clamp(14px, 2.6vh, 28px);
      color: #d4cdc6;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2vh;
    }

    .lyrics-lines {
      list-style: none;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      scroll-behavior: smooth;
      font-family: 'Noto Serif Gurmukhi', 'Mukta Mahee', serif;
      font-size: clamp(20px, 4.6vh, 52px);
      line-height: 1.7;
      color: rgba(254, 248, 232, 0.42);
      /* Fade lines in and out at the edges instead of cutting them off. */
      -webkit-mask-image: linear-gradient(transparent, #000 8%, #000 88%, transparent);
      mask-image: linear-gradient(transparent, #000 8%, #000 88%, transparent);
      padding: 2vh 0 30vh;
    }

    .lyrics-lines li {
      transition: color 0.4s;
    }

    .lyrics-lines li.current {
      color: #fef8e8;
      font-weight: 600;
    }

    /* Short screens (Nest Hub is 1024x600): keep the plain card on screen. */
    @media (max-height: 700px) {
      .logo {
        margin-bottom: 24px;
      }

      .logo img {
        height: 56px !important;
      }

      .now-playing {
        padding: 24px 40px;
      }

      .artwork {
        margin-bottom: 12px;
      }

      .artwork img {
        width: 160px !important;
        height: 160px !important;
      }

      .metadata {
        margin-top: 12px;
      }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      .title {
        font-size: 24px;
      }

      .artwork img {
        width: 160px;
        height: 160px;
      }

      .now-playing {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <!-- Relative paths so the page works from any origin it's served on -->
      <img src="/logos/atthebunga-logo-1A.png" alt="atTheBunga" style="height: 80px; width: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">
    </div>

    <div class="now-playing">
      <div class="artwork">
        <!-- Logo as default artwork (sender metadata can override with station art) -->
        <img id="artworkImage" src="/logos/atthebunga-logo-1A.png" alt="Album artwork" style="width: 200px; height: 200px; border-radius: 8px; border: 1px solid #d4cdc6; object-fit: contain; background: #2a2520; padding: 20px;">
      </div>

      <div class="metadata">
        <div class="artist" id="artist">Now Playing</div>
        <div class="title" id="title">Waiting for audio stream...</div>
        <div class="station-info" id="station">Stream atTheBunga</div>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="status-message" id="statusMessage">Connecting to stream...</div>
      </div>
    </div>

    <section class="lyrics" aria-label="Shabad being sung">
      <div class="lyrics-source" id="lyricsSource"></div>
      <ol class="lyrics-lines" id="lyricsLines" lang="pa"></ol>
    </section>
  </div>

  <!-- CAF receiver framework: cast-media-player owns playback (audio included);
       it stays hidden and the custom layout above is driven by PlayerManager events. -->
  <cast-media-player style="display: none;"></cast-media-player>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="/cast-lyrics.js"></script>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();
    const EventType = cast.framework.events.EventType;

    // The shabad being sung on whatever station is loaded; stations without lyrics show the card alone.
    const renderLyrics = castLyrics.createRenderer(document);
    let lyricsFor = null;
    let stopLyrics = () => {};
    function followLyrics(mediaUrl) {
      if (mediaUrl === lyricsFor) return;
      lyricsFor = mediaUrl;
      stopLyrics();
      renderLyrics(null);
      stopLyrics = castLyrics.follow(mediaUrl, renderLyrics, EventSource);
    }

    // Senders differ: the CLI sends GENERIC metadata (title/subtitle), the web
    // player sends MusicTrack metadata (title/artist). Handle both.
    // Driven by the player itself: PlayerDataBinder never fired on a Nest Hub.
    function showMedia() {
      const media = playerManager.getMediaInformation();
      if (!media) return;
      const metadata = media.metadata || {};
      document.getElementById('title').textContent = metadata.title || 'Now Playing';
      document.getElementById('station').textContent =
        metadata.subtitle || metadata.artist || 'Stream atTheBunga';
      const image = metadata.images && metadata.images[0] && metadata.images[0].url;
      document.getElementById('artworkImage').src = image || '/logos/atthebunga-logo-1A.png';
      followLyrics(media.contentUrl || media.contentId || '');
    }

    function showState(playing, message) {
      document.getElementById('loading').style.display = playing ? 'none' : '';
      if (!playing) document.getElementById('statusMessage').textContent = message;
    }

    playerManager.addEventListener(EventType.PLAYER_LOAD_COMPLETE, showMedia);
    playerManager.addEventListener(EventType.PLAYING, () => { showMedia(); showState(true); });
    playerManager.addEventListener(EventType.BUFFERING, (e) => { if (e.isBuffering) showState(false, 'Connecting to stream...'); });
    playerManager.addEventListener([EventType.ENDED, EventType.ERROR], () => showState(false, 'Waiting for audio stream...'));

    // We draw our own screen. Without this, smart displays (Nest Hub) lay the SDK's
    // touch-controls player over the page, hiding the card and the lyrics.
    context.start({ uiConfig: { touchScreenOptimizedApp: true } });
  </script>
</body>
</html>
