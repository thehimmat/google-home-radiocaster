# The streaming server on kosh-db (README.md). Run Compose from this folder: it reads .env here.
# The name matters: this folder is called selfhost, like kosh's, and Compose would otherwise treat
# both as one project.
name: radio

services:
  radio:
    image: ghcr.io/thehimmat/google-home-radiocaster/streaming-server:${RADIO_TAG:-latest}
    restart: unless-stopped
    # The VM is shared with kosh's database and atthebunga-server's gateway and apps.
    mem_limit: 2g
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    env_file: .env
    networks: [radio-edge]
    environment:
      PORT: "3001"
      HLS_ROOT: /data/hls
      # The lyrics service below, for /now-playing (503 there while the lyrics profile is off).
      LYRICS_URL: http://lyrics:3002
    ports:
      # Host-side only: smoke.sh and debugging. The public way in is atthebunga-server's gateway.
      - "127.0.0.1:3001:3001"
    volumes:
      # Segments and status history survive restarts and deploys (Fly's hls_data volume did the same).
      - ${HLS_DIR:-/srv/radio/hls}:/data/hls
    # /stations, not /health: /health is 503 whenever no source is live, which isn't a reason to
    # fail a deploy or restart the server.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/stations').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 10s

  # Follows the shabad being sung (lyrics/ in this repo, Kirtan Saathi's engine). Opt-in: add
  # COMPOSE_PROFILES=lyrics to .env. Reads the radio's own stream, so SGPC sees no extra listener.
  lyrics:
    image: ghcr.io/thehimmat/google-home-radiocaster/lyrics:${LYRICS_TAG:-latest}
    profiles: [lyrics]
    restart: unless-stopped
    # Speech recognition runs nonstop; a cap keeps the radio and the site's apps responsive. One station
    # measured 0.79-0.89 of an Ampere core (2026-11-10/11). The VM is 2 OCPU (Always Free), so 1.2
    # leaves the rest 0.8; a second station needs a bigger VM, which Pay As You Go bills.
    cpus: 1.2
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [radio-edge]
    environment:
      RADIO_URL: http://radio:3001
      LYRICS_STATIONS: ${LYRICS_STATIONS:-golden-temple}
      PORT: "3002"
      LYRICS_LOG_DIR: /data/lyrics
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      # Display changes and interludes, one JSONL per station, for scoring the follower later.
      - ${LYRICS_DIR:-/srv/radio/lyrics}:/data/lyrics
    depends_on: [radio]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

networks:
  # Made by thehimmat/atthebunga-server's host-setup.sh. Its gateway is the way in.
  radio-edge:
    external: true
