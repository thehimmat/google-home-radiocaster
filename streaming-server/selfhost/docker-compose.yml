# The streaming server on kosh-db (README.md). Run Compose from this folder: it reads .env here.
# The name matters: this folder is called selfhost, like kosh's, and Compose would otherwise treat
# both as one project.
name: radio

services:
  radio:
    image: ghcr.io/thehimmat/google-home-radiocaster/streaming-server:${RADIO_TAG:-latest}
    restart: unless-stopped
    # The VM is shared with kosh's database and apps.
    mem_limit: 2g
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    env_file: .env
    networks: [radio-edge]
    environment:
      PORT: "3001"
      HLS_ROOT: /data/hls
    ports:
      # Host-side only: smoke.sh and debugging. The public way in is kosh's gateway.
      - "127.0.0.1:3001:3001"
    volumes:
      # Segments and status history survive restarts and deploys (Fly's hls_data volume did the same).
      - ${HLS_DIR:-/srv/radio/hls}:/data/hls
    # /stations, not /health: /health is 503 whenever no source is live, which isn't a reason to
    # fail a deploy or restart the server.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/stations').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 10s

networks:
  # Made by kosh-db's stack (gurmukhi-kosh, selfhost/docker-compose.apps.yml). Its gateway is the way in.
  radio-edge:
    external: true
