name: Deploy lyrics follower to Oracle

# On every push to main that touches lyrics/: test, build its arm64 image and push it to GHCR
# (tags latest and the commit SHA), then run the VM's deploy, which pulls every enabled service.
# The lyrics service only runs where .env has COMPOSE_PROFILES=lyrics
# (streaming-server/selfhost/docker-compose.yml).

on:
  push:
    branches: [main]
    paths:
      - 'lyrics/**'
      - '.github/workflows/lyrics-deploy.yml'
  workflow_dispatch:

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyrics
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lyrics/package-lock.json
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: lyrics
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/lyrics:latest
            ghcr.io/${{ github.repository }}/lyrics:${{ github.sha }}
          cache-from: type=gha,scope=lyrics
          cache-to: type=gha,mode=max,scope=lyrics

  deploy:
    needs: image
    if: ${{ vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy on the VM
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077 && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command is deploy.sh, which reads the target from this.
          ssh -o BatchMode=yes "$HOST" radio
