name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  caster:
    name: Caster (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  streaming-server:
    name: Streaming server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streaming-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: streaming-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  selfhost:
    name: Oracle VM config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streaming-server/selfhost
    steps:
      - uses: actions/checkout@v5
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Compose file
        # The VM's .env holds real settings; an empty one stands in for it here.
        run: |
          touch .env
          docker compose config -q
